<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시운전 일정</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--sub:#6b7280;--bd:#e5e7eb;--pri:#1f3a8a;--priBg:#e8edfb;
--late:#dc2626;--g0:#3b6fe0;--g1:#14a38b;--g2:#8b5cf6;--g3:#f59e0b;--g4:#ef4444;--okBg:#e7f6ec;--okTx:#166534;--wnBg:#fff1da;--wnTx:#9a4b00}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#1a1f27;--tx:#eef0f3;--sub:#9aa3af;--bd:#2b323c;--pri:#9db7ff;--priBg:#25304d;--okBg:#173324;--okTx:#8fe0ab;--wnBg:#3d2a10;--wnTx:#ffc27a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Noto Sans KR",sans-serif;padding-bottom:40px}
header{padding:14px 14px 4px}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:19px;margin:0;flex:1;letter-spacing:-.3px}
button{font:inherit;color:var(--tx);border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer}
.bn{margin-top:10px;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.bn b{font-size:15px}.bn span{font-size:13px;font-weight:600}.bn small{font-size:11px;opacity:.75}
.bn.ok{background:var(--okBg);color:var(--okTx)}.bn.warn{background:var(--wnBg);color:var(--wnTx)}
.seg{display:flex;background:var(--bd);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px #0002}
.tabs{display:flex;gap:18px;margin-top:10px;padding:0 4px;border-bottom:1px solid var(--bd)}
.tabs button{border:0;background:none;border-radius:0;padding:8px 2px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.late-n{color:var(--late)}
main{padding:12px 14px}
.cal{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 3px #0001}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:16px}
.hd button{padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:11px;color:var(--sub);padding-bottom:2px}.dow:first-child{color:var(--late)}
.day{min-height:50px;padding:4px;border:1px solid transparent;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.day .n{font-size:12px}.day .c{font-size:13px;font-weight:800;text-align:right;min-height:16px}
.day.td{border-color:var(--pri)}.day.sel{background:var(--pri);color:#fff}.day.sel .n,.day.sel .c{color:#fff}
.dots{display:flex;gap:2px;min-height:6px}.dots i{width:6px;height:6px;border-radius:3px;display:block}
h2{font-size:17px;margin:16px 2px 8px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{background:var(--card);border:2px solid transparent;border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 1px 3px #0001}
.tile i{width:18px;height:4px;border-radius:2px;display:block}.tile span{font-size:12px;color:var(--sub)}.tile b{font-size:22px;line-height:1.1}
.tile.on{border-color:var(--pri);background:var(--priBg)}
.hint{font-size:12px;color:var(--sub);margin:6px 2px}
h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;color:var(--tx);margin:22px 2px 8px}
h3 i{width:5px;height:20px;border-radius:3px;display:block}
h3 em{font-style:normal;color:var(--pri);font-size:16px}
.card{background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:8px;border-left:5px solid var(--bd);box-shadow:0 1px 3px #0001}
.card.today{border-left-color:#eab308}.card.tmr{border-left-color:#65a30d}.card.done{border-left-color:#9ca3af;opacity:.6}.card.late{border-left-color:var(--late)}
.t1{font-weight:700}.t2{font-size:13px;color:var(--sub);margin-top:4px}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-right:4px;color:#fff}
.bad{background:var(--late)}.ok{background:#6b7280}.warn{background:#ea7a1a}
.note{font-size:12px;margin-top:6px;padding:6px 9px;background:var(--bg);border-radius:8px;white-space:pre-wrap}
.empty{text-align:center;color:var(--sub);padding:30px 0}
</style>
</head>
<body>
<header>
  <div class="top"><h1>시운전 일정</h1><button id="rf">새로고침</button></div>
  <div id="bn"></div>
  <div class="seg" id="team"></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"><div class="empty">불러오는 중...</div></main>
<script>
// ★ 설정: 구글시트 "웹에 게시"에서 복사한 CSV 주소를 아래에 붙여넣으세요
const CSV_URL = '여기에_CSV_주소를_붙여넣기';
// 시트 반영일을 적는 칸 (0부터 센 [행, 열]) : B3 = [2, 1]
const STAMP = [2, 1];

const G=[0,1,2,3,3,3,4], GN=['시공 검측','기압 검측','수압 검측','완성·초기·FT','T/O'], TL=['시공','기압','수압','완성','T/O'], SN=['시공','기압','수압','완성','초기','FT','T/O'];
const GC=['--g0','--g1','--g2','--g3','--g4'], TEAMS=[['all','전체'],['pipe','배관'],['duct','덕트']];
const WD=['일','월','화','수','목','금','토'];
const st={team:'all',grp:-1,view:'main',month:'',sel:''};
let DATA=null;
const INIT_TEAM=new URLSearchParams(location.search).get('team')||'';
try{const t=INIT_TEAM||localStorage.getItem('team');if(t&&TEAMS.some(x=>x[0]===t))st.team=t;}catch(e){if(TEAMS.some(x=>x[0]===INIT_TEAM))st.team=INIT_TEAM;}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayStr=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
const add=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const md=s=>{const d=new Date(s+'T00:00:00Z');return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+'('+WD[d.getUTCDay()]+')'};
const diff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const iso=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const pick=l=>st.grp<0?l:l.filter(c=>c.g===st.grp);

/* ---------- 시트(CSV) 읽기 ---------- */
function pd(s){
  s=String(s==null?'':s).trim();if(!s)return '';
  let m;
  if(m=s.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/))return iso(+m[1],+m[2],+m[3]);
  if(m=s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)||s.match(/^(\d{1,2})[\/.](\d{1,2})(?!\d)/)){
    const mo=+m[1],d=+m[2],ty=+todayStr().slice(0,4);let best='',bd=1e9;
    [ty-1,ty,ty+1].forEach(y=>{const ds=iso(y,mo,d),df=Math.abs(diff(ds,todayStr()));if(df<bd){bd=df;best=ds}});
    return best;
  }
  return '';
}
function parseCSV(t){
  const R=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f);R.push(r);r=[];f=''}
    else if(c!=='\r')f+=c;
  }
  if(f!==''||r.length){r.push(f);R.push(r)}
  return R;
}
function buildRows(R){
  const rows=[];
  for(let i=4;i<R.length;i++)for(let c=1;c<=4;c++)if(!String(R[i][c]).trim())R[i][c]=R[i-1][c];
  for(let i=4;i<R.length;i++){
    if(String(R[i][5]).trim()!=='계획')continue;
    const act=(R[i+1]&&String(R[i+1][5]).trim()==='실적')?R[i+1]:null;
    const s=[];
    for(let k=0;k<7;k++){
      const raw=String(R[i][6+k]).trim(),p=pd(raw);
      const done=(act&&String(act[6+k]).trim()!=='')||raw==='완료';
      s.push(p?[p,done?1:0]:null);
    }
    if(!s.some(x=>x))continue;
    const tr=String(R[i][1]).trim();
    rows.push({r:i+1,t:tr.indexOf('덕트')>=0?'duct':'pipe',tr,
      loc:String(R[i][2]).replace(/\s*\n\s*/g,' '),sys:String(R[i][3]).replace(/\s*\n\s*/g,' '),pkg:String(R[i][4]),
      note:[R[i][13],R[i][14]].filter(x=>x&&String(x).trim()).map(String).join(' / ').replace(/\s*\n\s*/g,' '),s});
  }
  return rows;
}

/* ---------- 화면 ---------- */
function banner(){
  const T=todayStr(),raw=String(DATA.stamp||'').trim();
  if(!raw)return '<div class="bn warn"><b>⚠ 시트 반영일이 입력되지 않았어요</b><span>시트 B3 칸에 반영 날짜를 적어주세요.</span></div>';
  const d=pd(raw);
  if(!d)return `<div class="bn warn"><b>시트 반영 ${esc(raw)}</b><small>날짜 형식을 읽지 못했어요. 예: 2026-10-08 16:30</small></div>`;
  const fresh=d===T;
  return `<div class="bn ${fresh?'ok':'warn'}"><b>${fresh?'✔':'⚠'} 시트 반영 ${esc(raw)}</b>${fresh?'':'<span>오늘 반영 전 자료일 수 있어요. 일정 담당자에게 확인하세요.</span>'}</div>`;
}
function build(){
  const T=todayStr(),M=add(T,1),out=[];
  DATA.rows.forEach(r=>{
    if(st.team!=='all'&&r.t!==st.team)return;
    const m={};
    r.s.forEach((x,i)=>{
      if(!x)return;
      let prev='';
      r.s.forEach((y,j)=>{if(y&&j<i&&G[j]!==G[i]&&y[0]>prev)prev=y[0]});
      const chk=!x[1]&&prev&&x[0]<prev;
      const k=G[i]+'|'+x[0]+'|'+x[1];
      (m[k]=m[k]||{r,g:G[i],plan:x[0],done:!!x[1],chk:false,idx:[]});
      m[k].idx.push(i); if(chk)m[k].chk=true;
    });
    Object.values(m).forEach(c=>{
      c.label=c.g===3?(c.idx.length===3?'완성·초기·FT':c.idx.map(i=>SN[i]).join('·')):GN[c.g];
      c.status=c.done?'done':c.plan===T?'today':c.plan===M?'tmr':c.plan<T?'late':'plan';
      c.late=c.status==='late'?diff(T,c.plan):0;
      out.push(c);
    });
  });
  return out;
}
function cardHtml(c,showDate){
  const r=c.r,where=[r.loc,r.sys,(r.pkg&&r.pkg!=='통합')?r.pkg:''].filter(Boolean).join(' · ');
  let tags='';
  if(c.g===3&&c.idx.length!==3)tags+=`<span class="tag" style="background:var(${GC[c.g]})">${esc(c.label)}</span>`;
  if(c.status==='late')tags+=`<span class="tag bad">지연 ${c.late}일</span>`;
  if(c.status==='done')tags+=`<span class="tag ok">완료</span>`;
  if(c.chk)tags+=`<span class="tag warn">순서확인</span>`;
  const t2=tags+(showDate?esc(md(c.plan)):'');
  return `<div class="card ${c.status}"><div class="t1">${esc(r.tr)} · ${esc(where)}</div>${t2?`<div class="t2">${t2}</div>`:''}${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div>`;
}
function tiles(list){
  const n=[0,0,0,0,0];list.forEach(c=>n[c.g]++);
  return `<div class="tiles">${TL.map((g,i)=>`<button class="tile${st.grp===i?' on':''}" data-g="${i}"><i style="background:var(${GC[i]})"></i><span>${g}</span><b>${n[i]}</b></button>`).join('')}</div>
  <div class="hint">칸을 누르면 해당 단계만 보여요 · 완성 = 완성검사·초기관리·FT기술</div>`;
}
function listBy(list,showDate){
  if(!list.length)return '<div class="empty">해당 일정이 없습니다</div>';
  let h='';
  GN.forEach((g,i)=>{
    const l=list.filter(c=>c.g===i).sort((a,b)=>a.plan.localeCompare(b.plan)||a.r.r-b.r.r);
    if(l.length)h+=`<h3><i style="background:var(${GC[i]})"></i>${g} <em>${l.length}건</em></h3>`+l.map(c=>cardHtml(c,showDate)).join('');
  });
  return h;
}
function render(){
  if(!DATA)return;
  const all=build();
  $('bn').innerHTML=banner();
  $('team').innerHTML=TEAMS.map(t=>`<button data-t="${t[0]}" class="${st.team===t[0]?'on':''}">${t[1]}</button>`).join('');
  const nL=all.filter(c=>c.status==='late').length;
  $('tabs').innerHTML=[['main','일정'],['late','지연 <span class="late-n">'+nL+'</span>']].map(x=>`<button data-v="${x[0]}" class="${st.view===x[0]?'on':''}">${x[1]}</button>`).join('');
  if(st.view==='late'){
    const l=all.filter(c=>c.status==='late');
    $('main').innerHTML=`<div class="hint">계획일이 지났는데 실적이 없는 항목</div>`+tiles(l)+listBy(pick(l),true);
  }else $('main').innerHTML=calHtml(all);
}
function calHtml(all){
  const T=todayStr();if(!st.month)st.month=T.slice(0,7);if(!st.sel)st.sel=T;
  const by={};all.forEach(c=>(by[c.plan]=by[c.plan]||[]).push(c));
  const [y,m]=st.month.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  let g=WD.map(w=>`<div class="dow">${w}</div>`).join('');
  for(let i=0;i<first;i++)g+='<div></div>';
  for(let d=1;d<=dim;d++){
    const ds=iso(y,m,d),l=by[ds]||[];
    const gs=[...new Set(l.map(c=>c.g))].sort();
    g+=`<button class="day${ds===T?' td':''}${ds===st.sel?' sel':''}" data-d="${ds}"><span class="n">${d}</span><span class="dots">${gs.map(x=>`<i style="background:var(${GC[x]})"></i>`).join('')}</span><span class="c">${l.length||''}</span></button>`;
  }
  const sl=by[st.sel]||[];
  return `<div class="cal"><div class="hd"><button data-m="-1">‹</button><span>${y}년 ${m}월</span><button data-m="1">›</button></div><div class="grid">${g}</div></div>
  <h2>${md(st.sel)}</h2>${tiles(sl)}${listBy(pick(sl),false)}`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='rf'){load();return}
  if(b.dataset.t){st.team=b.dataset.t;try{localStorage.setItem('team',st.team)}catch(x){}}
  else if(b.dataset.g!==undefined){const v=+b.dataset.g;st.grp=st.grp===v?-1:v}
  else if(b.dataset.v){st.view=b.dataset.v}
  else if(b.dataset.d){st.sel=b.dataset.d;st.month=b.dataset.d.slice(0,7)}
  else if(b.dataset.m){const [y,m]=st.month.split('-').map(Number),d=new Date(Date.UTC(y,m-1+(+b.dataset.m),1));st.month=d.toISOString().slice(0,7)}
  render();
});
async function load(){
  if(CSV_URL.indexOf('docs.google.com')<0){$('main').innerHTML='<div class="empty">코드 위쪽 CSV_URL에 구글시트 게시 주소를 붙여넣어 주세요.</div>';return}
  $('main').innerHTML='<div class="empty">불러오는 중...</div>';
  try{
    const res=await fetch(CSV_URL+(CSV_URL.indexOf('?')<0?'?':'&')+'_='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const R=parseCSV(await res.text()).map(r=>{while(r.length<16)r.push('');return r});
    if(!R[3]||String(R[3][6]).replace(/\s/g,'').indexOf('시공검측')<0)throw new Error('게시된 탭이 일정 시트가 아니에요 (4행 G열이 "시공 검측"인지 확인)');
    DATA={stamp:(R[STAMP[0]]||[])[STAMP[1]]||'',rows:buildRows(R)};
    render();
  }catch(err){$('main').innerHTML='<div class="empty">불러오기 실패: '+esc(err.message||err)+'</div>'}
}
load();
</script>
</body>
</html>
